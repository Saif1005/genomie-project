# GermlineIQ — local server deployment (on-premise, remote access via AnyDesk)
#
# Recommended start: bash scripts/start.sh
#   (adds docker-compose.gpu.yml if an NVIDIA GPU is usable by Docker)
# Manuel : docker compose -f docker-compose.local.yml --env-file Backend/.env up -d --build
#
# Security: ports are only published on BIND_ADDRESS (127.0.0.1 by default).
# To open the interface to the local network: BIND_ADDRESS=<server LAN IP> in Backend/.env.

name: germlineiq

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-0}
    volumes:
      # Persistent Mistral models (see scripts/pull_models.sh)
      - ${LOCAL_DATA_ROOT:-/data/germlineiq}/models/ollama:/root/.ollama
    networks: [germlineiq]
    # No published port: only the backend talks to Ollama (http://ollama:11434)
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      LOCAL_DATA_ROOT: ${LOCAL_DATA_ROOT:-/data/germlineiq}
      OLLAMA_HOST: http://ollama:11434
      HF_HOME: ${LOCAL_DATA_ROOT:-/data/germlineiq}/models/huggingface
      PYTHONPATH: /app
    volumes:
      # Same path in the container and on the host: required because the GATK / Parabricks
      # containers are started by the host Docker daemon (docker run -v X:X).
      - ${LOCAL_DATA_ROOT:-/data/germlineiq}:${LOCAL_DATA_ROOT:-/data/germlineiq}
      # ⚠ Gives the backend control of the host Docker (root-equivalent). Required to start
      #   GATK/Parabricks. Never expose the backend outside the server/LAN.
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    depends_on:
      ollama:
        condition: service_healthy
    networks: [germlineiq]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

  frontend:
    build:
      context: ./Frontend
      args:
        # The browser calls /api/v1 on the frontend port; Next.js proxies here.
        BACKEND_INTERNAL_URL: http://backend:8000
        NEXT_PUBLIC_LOCAL_DATA_ROOT: ${LOCAL_DATA_ROOT:-/data/germlineiq}
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [germlineiq]

networks:
  germlineiq:
    name: germlineiq
