# GPU override — added automatically by scripts/start.sh if an NVIDIA GPU is usable by
# Docker (driver + NVIDIA Container Toolkit).
# Gives the GPU to Ollama (Mistral) and to the backend (BioGPT, nvidia-smi for VRAM detection).
# Parabricks is started separately by the backend with `docker run --gpus all`.

services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
